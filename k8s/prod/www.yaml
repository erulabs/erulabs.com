apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: www
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_HOSTNAME
              value: seandonmooy.com
---
apiVersion: v1
kind: Service
metadata:
  name: www
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 80
  selector:
    app: www
